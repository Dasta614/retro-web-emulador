<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Emulador GBC Web</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; font-size: 1.5rem; }
        #game-container {
            width: 640px;
            height: 576px;
            max-width: 100%;
            background: #000;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Game Boy Color Web</h1>
    
    <!-- Contenedor del Emulador -->
    <div id="game-container"></div>

    <div class="instructions">
        <p>Usa las flechas del teclado / A, S, Enter, Espacio o conecta tu control.</p>
    </div>

    <!-- Script de EmuJS para Game Boy Color -->
    <script>
        EmuJS = {
            game: "pokemon_rojo", // Aquí definiremos la ROM de prueba
            system: "gbc",
            // Configuración básica para cargar ROMs y emular
        };
    </script>
    <!-- Cargamos el script principal de EmuJS -->
    <script src="https://emujs.org/embed.js"></script>

</body>
</html>
