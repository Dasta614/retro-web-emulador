<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Consola Web Retro (GBC & PS1)</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 5px; font-size: 1.8rem; color: #38bdf8; }
        .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
        
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            background: #000;
            border: 4px solid #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: center;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>RetroCloud Web</h1>
    <div class="subtitle">Emulador Web multi-consola (GBC, PS1 y enlaces de PS2)</div>
    
    <!-- Contenedor donde se montará el emulador -->
    <div id="game-container"></div>

    <div class="instructions">
        <p>🎮 **Controles:** Teclado configurado o conecta tu Control de PS5 por USB/Bluetooth.</p>
    </div>

    <!-- Configuración de EmuJS para múltiples sistemas -->
    <script>
        EmuJS = {
            // Contenedor visual
            element: document.getElementById("game-container"),
            
            // Aquí definiremos las rutas de tus juegos (ROMs)
            // Para GBC y PS1 correrán directo en el navegador via WebAssembly.
            gameUrl: "roms/game.gbc", // Cambiarás esto según el juego que cargues
            system: "gbc", // Cambia a "psx" para PlayStation 1
            
            // Ajustes visuales y de rendimiento
            resolution: "auto",
            unmuteBG: true
        };
    </script>
    <!-- Cargador oficial de EmuJS -->
    <script src="https://emujs.org/embed.js"></script>

</body>
</html>
